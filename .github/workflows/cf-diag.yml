name: cf-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pages + workers + D1 probes with secret token/account
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for ep in pages/projects workers/scripts d1/database; do
            echo "== /accounts/\$ACC/$ep =="
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/$ep" | head -c 300
            echo
          done
