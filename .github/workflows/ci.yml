name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npx tsc --noEmit --strict

      - name: Test
        run: npx vitest run

      - name: Security Audit
        # audit-ci (config audit-ci.json): production deps only, fails on
        # critical+. Accepted-risk exceptions are GHSA-allowlisted with
        # justification in docs/DEPENDENCIES.md — never silently dropped.
        run: npx audit-ci --config audit-ci.json -c --package-manager npm

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            out
          # Scope the hash to tracked build inputs — the old
          # '**/*.ts, **/*.js, **/*.json' walked node_modules after npm ci
          # and hashFiles hit its 120s cap, failing the job outright.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'src/**', 'scripts/**', 'public/**/*.html', '*.ts', '*.js', '*.mjs', '*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build

      - name: Verify built output (sitemap crawl gate)
        # Tier-1 QA gate: every sitemap URL must emit a real page with title,
        # self-canonical, one h1, parseable JSON-LD, resolvable og:image, and
        # tool pages whose FAQ schema matches the visible DOM. Catches what
        # unit tests cannot see pre-build (see scripts/verify-out.ts).
        run: npx tsx scripts/verify-out.ts

      - name: Collect bundle stats
        run: npx tsx scripts/bundle-budget.ts --collect

      - name: Check bundle budget
        # C3.2/C3.3: shared-JS budget gate (default 500 KB gzip, override via
        # BUDGET_SHARED_KB env). Posts a summary table and fails the build job
        # on breach — blocks PRs and skips e2e until fixed.
        run: npx tsx scripts/bundle-budget.ts --check

  migrate:
    # #27: apply versioned D1 migrations on every main push. Pages does
    # NOT apply migrations_dir automatically — without this job, the
    # versioned migrations are documentation and the lazy runtime
    # CREATEs are the only thing standing between deploy and breakage.
    # Migrations are all IF NOT EXISTS / idempotent, so re-apply is safe.
    # Skips cleanly without secrets (same pattern as preview).
    if: github.event_name == 'push'
    needs: [quality, build]
    runs-on: ubuntu-latest
    env:
      # Same schema fix as the preview job — secrets can't appear in `if`.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Apply D1 migrations
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        run: npx wrangler d1 migrations apply toolhub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Migrations skipped (no secrets)
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret — run 'npx wrangler d1 migrations apply toolhub-db --remote' manually after deploy (see docs/DATA-MIGRATIONS.md)."

  e2e:
    # Browser E2E runs here (ubuntu), not locally: Playwright browsers
    # do not install on macOS 12. Runs against the static production
    # build served locally, so specs exercise real build output.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # All three engines — playwright.config.ts (CI branch) defines
      # chromium + firefox + webkit projects; chromium-only left firefox/
      # webkit missing and failed the job.
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npx serve out -l 3000 &
      - run: PLAYWRIGHT_BASE_URL=http://localhost:3000 npm run test:e2e
