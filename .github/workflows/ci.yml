name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npx tsc --noEmit --strict

      - name: Test
        run: npx vitest run

      - name: Security Audit
        # audit-ci (config audit-ci.json): production deps only, fails on
        # critical+. Accepted-risk exceptions are GHSA-allowlisted with
        # justification in docs/DEPENDENCIES.md — never silently dropped.
        run: npx audit-ci --config audit-ci.json -c --package-manager npm

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            out
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build

      - name: Verify built output (sitemap crawl gate)
        # Tier-1 QA gate: every sitemap URL must emit a real page with title,
        # self-canonical, one h1, parseable JSON-LD, resolvable og:image, and
        # tool pages whose FAQ schema matches the visible DOM. Catches what
        # unit tests cannot see pre-build (see scripts/verify-out.ts).
        run: npx tsx scripts/verify-out.ts

      - name: Collect bundle stats
        run: npx tsx scripts/bundle-budget.ts --collect

      - name: Check bundle budget
        # C3.2/C3.3: shared-JS budget gate (default 500 KB gzip, override via
        # BUDGET_SHARED_KB env). Posts a summary table and fails the build job
        # on breach — blocks PRs and skips e2e until fixed.
        run: npx tsx scripts/bundle-budget.ts --check

  preview:
    # C3.1 branch-aware PR previews via Cloudflare Pages direct upload.
    # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
    # (Cloudflare dashboard → My Profile → API Tokens). Skips cleanly without
    # them. Alternative with no secrets: Pages dashboard → toolzum project →
    # Settings → Builds & deployments → enable "Preview deployments for pull
    # requests" (native integration). Use ONE path, not both.
    if: github.event_name == 'pull_request'
    needs: [quality, build]
    runs-on: ubuntu-latest
    env:
      # `secrets` is NOT a legal context in `if` (workflow-schema error) —
      # the original `${{ secrets.X != '' }}` guards here zeroed every
      # workflow run with a 0s "workflow file issue" from Sep 10 2026.
      # Materialize booleans into env (legal) and branch on those.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Deploy PR preview
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=toolzum --branch=${{ github.head_ref }}

      - name: Preview skipped (no secrets)
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret — preview deploy skipped. Add the secrets or enable native PR previews in the Pages dashboard."

      - name: Preview URL
        # head_ref via env, not inline ${{ }} — branch names are PR-author
        # controlled (script-injection hardening; actionlint secure-use).
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: echo "Preview should be live at https://$PR_BRANCH.toolzum.pages.dev (Pages sanitizes branch characters)"

  migrate:
    # #27: apply versioned D1 migrations on every main push. Pages does
    # NOT apply migrations_dir automatically — without this job, the
    # versioned migrations are documentation and the lazy runtime
    # CREATEs are the only thing standing between deploy and breakage.
    # Migrations are all IF NOT EXISTS / idempotent, so re-apply is safe.
    # Skips cleanly without secrets (same pattern as preview).
    if: github.event_name == 'push'
    needs: [quality, build]
    runs-on: ubuntu-latest
    env:
      # Same schema fix as the preview job — secrets can't appear in `if`.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Apply D1 migrations
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        run: npx wrangler d1 migrations apply toolhub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Migrations skipped (no secrets)
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret — run 'npx wrangler d1 migrations apply toolhub-db --remote' manually after deploy (see docs/DATA-MIGRATIONS.md)."

  e2e:
    # Browser E2E runs here (ubuntu), not locally: Playwright browsers
    # do not install on macOS 12. Runs against the static production
    # build served locally, so specs exercise real build output.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # All three engines — playwright.config.ts (CI branch) defines
      # chromium + firefox + webkit projects; chromium-only left firefox/
      # webkit missing and failed the job.
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npx serve out -l 3000 &
      - run: PLAYWRIGHT_BASE_URL=http://localhost:3000 npm run test:e2e
