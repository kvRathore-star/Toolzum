name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npx tsc --noEmit --strict

      - name: Test
        run: npx vitest run

      - name: Security Audit
        # Audit production deps only. Known unfixable issues excluded:
        # - xlsx: no fix available (prototype pollution in SheetJS)
        # - dompurify: fix requires breaking jspdf upgrade (moderate severity)
        run: npm audit --omit=dev --audit-level=critical

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Build
        run: npm run build
