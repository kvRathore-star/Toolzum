name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npx tsc --noEmit --strict

      - name: Test
        run: npx vitest run

      - name: Security Audit
        # Audit production deps only. Known unfixable issues excluded:
        # - xlsx: no fix available (prototype pollution in SheetJS)
        # - dompurify: fix requires breaking jspdf upgrade (moderate severity)
        run: npm audit --omit=dev --audit-level=critical

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            out
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build

      - name: Collect bundle stats
        run: npx tsx scripts/bundle-budget.ts --collect

      - name: Check bundle budget
        # C3.2/C3.3: shared-JS budget gate (default 500 KB gzip, override via
        # BUDGET_SHARED_KB env). Posts a summary table and fails the build job
        # on breach — blocks PRs and skips e2e until fixed.
        run: npx tsx scripts/bundle-budget.ts --check

  preview:
    # C3.1 branch-aware PR previews via Cloudflare Pages direct upload.
    # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
    # (Cloudflare dashboard → My Profile → API Tokens). Skips cleanly without
    # them. Alternative with no secrets: Pages dashboard → toolzum project →
    # Settings → Builds & deployments → enable "Preview deployments for pull
    # requests" (native integration). Use ONE path, not both.
    if: github.event_name == 'pull_request'
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Deploy PR preview
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=toolzum --branch=${{ github.head_ref }}

      - name: Preview skipped (no secrets)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret — preview deploy skipped. Add the secrets or enable native PR previews in the Pages dashboard."

      - name: Preview URL
        run: echo "Preview should be live at https://${{ github.head_ref }}.toolzum.pages.dev (Pages sanitizes branch characters)"

  migrate:
    # #27: apply versioned D1 migrations on every main push. Pages does
    # NOT apply migrations_dir automatically — without this job, the
    # versioned migrations are documentation and the lazy runtime
    # CREATEs are the only thing standing between deploy and breakage.
    # Migrations are all IF NOT EXISTS / idempotent, so re-apply is safe.
    # Skips cleanly without secrets (same pattern as preview).
    if: github.event_name == 'push'
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Apply D1 migrations
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply toolhub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Migrations skipped (no secrets)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret — run 'npx wrangler d1 migrations apply toolhub-db --remote' manually after deploy (see docs/DATA-MIGRATIONS.md)."

  e2e:
    # Browser E2E runs here (ubuntu), not locally: Playwright browsers
    # do not install on macOS 12. Runs against the static production
    # build served locally, so specs exercise real build output.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx serve out -l 3000 &
      - run: PLAYWRIGHT_BASE_URL=http://localhost:3000 npm run test:e2e
